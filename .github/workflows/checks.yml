name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install the locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.lock.txt
          python -m pip check
      - name: Check saved assets, replay and app views
        run: python scripts/check_release.py --ui
      - name: Build deployment image
        run: docker build -t football-prediction-v2:check .
